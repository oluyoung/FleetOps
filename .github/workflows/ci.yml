name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleetops
          POSTGRES_PASSWORD: fleetops
          POSTGRES_DB: fleetops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fleetops:fleetops@localhost:5432/fleetops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@11.12.1

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - run: npm run migrate --workspace=api -- up
      - run: npm run test
      - run: npm run build

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@11.12.1

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci

      # Migrations run against Supabase before the new image goes live, so a
      # failed migration blocks the deploy instead of shipping a backend
      # that expects a schema that isn't there yet.
      #
      # Uses the direct (non-pooled) connection, not the session-pooler
      # DATABASE_URL the app uses — the session pooler caps at 15 total
      # clients, and the always-on fleetops-api machine's own pg.Pool can
      # hold most of that budget, leaving no room for this one-off client.
      - name: Run database migrations against Supabase
        run: npm run migrate --workspace=api -- up
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy fleetops-api
        run: flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Only redeployed when their own image changes are relevant — cheap to
      # run every time at this scale, so no path filtering yet.
      - name: Deploy fleetops-mqtt
        run: flyctl deploy --config infra/fly/mqtt/fly.toml --dockerfile infra/fly/mqtt/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy fleetops-telemetry-publisher
        run: flyctl deploy --config apps/telemetry-publisher/fly.toml --dockerfile apps/telemetry-publisher/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy fleetops-grafana-alloy
        run: flyctl deploy --config infra/fly/grafana-alloy/fly.toml --dockerfile infra/fly/grafana-alloy/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Vercel deploys apps/web itself via its native GitHub integration —
      # no step needed here.
