# fly.toml app configuration file generated for fleetops-api-muddy-frog-719 on 2026-08-12T08:21:58+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fleetops-api-muddy-frog-719'
primary_region = 'ams'

[build]
  dockerfile = './Dockerfile'

[env]
  LOG_LEVEL = 'info'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
