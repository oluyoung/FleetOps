global:
  scrape_interval: 5s

scrape_configs:
  - job_name: fleetops-api
    static_configs:
      # apps/api runs on the host (turbo dev), not as a Compose service —
      # host.docker.internal resolves back to the host from inside the
      # prometheus container (see the extra_hosts entry in docker-compose.yml).
      - targets: ["host.docker.internal:4000"]
